<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>건강몬 GO | 세종대학교 건강 미션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
:root {
  --ink:#0E1330; --ink2:#141A42; --panel:#1B2257; --panel2:#232B6B; --line:#3A4690;
  --indigo:#2F3FB8; --indigo-d:#1B2380; --violet:#7B5BE0; --violet-d:#4A32A8;
  --frost:#E6ECFF; --mute:#9AA6D8; --amber:#FFB534; --amber-d:#B87A00;
  --ok:#43D6B0; --bad:#FF7A90;
  --display:'Black Han Sans','Noto Sans KR','Noto Sans CJK KR','Noto Sans CJK JP',sans-serif;
  --body:'Noto Sans KR','Noto Sans CJK KR','Noto Sans CJK JP',system-ui,sans-serif;
  --c:14px;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; background:#080B20; color:var(--frost); font-family:var(--body); font-size:15px; line-height:1.5; }
button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
input { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }

#app { position:relative; max-width:440px; height:100dvh; margin:0 auto; display:flex; flex-direction:column; overflow:hidden;
  background:linear-gradient(180deg,#121A4E 0%, var(--ink) 46%, #0A0E26 100%); }
.shards { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.shards i { position:absolute; display:block; }
.shards i:nth-child(1){ left:-20%; top:-6%; width:90%; height:340px; background:linear-gradient(135deg,#3446C9,#1B2380); clip-path:polygon(0 0,100% 10%,38% 100%); opacity:.55; }
.shards i:nth-child(2){ right:-24%; top:90px; width:80%; height:360px; background:linear-gradient(200deg,#8B6BEE,#3A2A93); clip-path:polygon(100% 0,100% 100%,0 62%); opacity:.38; }
.shards i:nth-child(3){ left:12%; top:240px; width:70%; height:260px; background:linear-gradient(160deg,#2F3FB8,#141A42); clip-path:polygon(0 30%,100% 0,64% 100%); opacity:.35; }

/* 공통 각진 패널: 좌상단·우하단만 깎음 */
.cut { clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c)); }
.panel { position:relative; --c:16px; background:linear-gradient(135deg,#4A58D6,#2A3290 60%,#3A2A93); }
.panel::before { content:""; position:absolute; inset:1px; background:linear-gradient(160deg,#1F2870,var(--panel)); clip-path:polygon(calc(var(--c) - .41px) 0,100% 0,100% calc(100% - var(--c) + .41px),calc(100% - var(--c) + .41px) 100%,0 100%,0 calc(var(--c) - .41px)); }
.panel > * { position:relative; }

/* 상단 HUD */
.hud { position:relative; z-index:2; display:flex; align-items:center; gap:12px; padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px; }
.lv { width:48px; height:52px; flex:none; display:grid; place-items:center; font-family:var(--display); font-size:19px; line-height:1; color:var(--ink);
  background:linear-gradient(160deg,#FFD27A,var(--amber)); clip-path:polygon(50% 0,100% 24%,100% 76%,50% 100%,0 76%,0 24%); padding-top:2px; }
.lv small { display:block; font-family:var(--body); font-size:9px; font-weight:700; margin-bottom:-1px; text-align:center; }
.who { flex:1; min-width:0; }
.who b { display:block; font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.xp { display:grid; grid-template-columns:repeat(10,1fr); gap:3px; margin-top:6px; }
.xp i { height:6px; background:#2A3280; transform:skewX(-24deg); }
.xp i.on { background:linear-gradient(90deg,var(--violet),#A68CFF); }
.wallet { display:flex; flex-direction:column; gap:4px; align-items:flex-end; }
.chip { --c:7px; display:inline-flex; align-items:center; gap:6px; padding:3px 12px 3px 9px; font-size:13px; font-weight:700; background:#10163D; border-left:3px solid var(--amber); clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%); }
.chip.p { border-left-color:var(--violet); }

/* 본문 */
main { position:relative; z-index:1; flex:1; overflow-y:auto; padding:6px 16px 24px; scrollbar-width:none; }
main::-webkit-scrollbar { display:none; }
h1 { font-family:var(--display); font-weight:400; font-size:30px; line-height:1.15; letter-spacing:-.5px; }
h2 { font-family:var(--display); font-weight:400; font-size:20px; letter-spacing:-.3px; }
.muted { color:var(--mute); font-size:13px; }
.sec { margin-top:22px; }
.sec > h2 { margin-bottom:10px; }

/* 히어로 */
.hero { margin-top:12px; }
.hero .stage { height:210px; display:grid; place-items:center; position:relative; overflow:hidden; background:linear-gradient(180deg,#2B38A8,#18205F); }
.hero .stage::before { content:""; position:absolute; left:50%; bottom:-70px; width:340px; height:150px; transform:translateX(-50%); background:linear-gradient(180deg,#7B5BE0,#3A2A93); clip-path:polygon(18% 0,82% 0,100% 100%,0 100%); opacity:.9; }
.hero .stage::after { content:""; position:absolute; left:50%; bottom:46px; width:190px; height:14px; transform:translateX(-50%); background:rgba(8,11,32,.55); clip-path:polygon(8% 0,92% 0,100% 100%,0 100%); }
.hero .stage svg { position:relative; z-index:1; width:150px; height:150px; margin-bottom:22px; filter:drop-shadow(0 10px 0 rgba(8,11,32,.28)); }
.hero .body { padding:16px 18px 18px; }
.hero h2 { font-size:24px; }
.hero .reward { margin-top:4px; }
.hero .reward b { color:var(--amber); font-weight:700; }

.btn { --c:12px; position:relative; display:block; width:100%; padding:14px 16px 12px; margin-top:14px; font-family:var(--display); font-size:18px; letter-spacing:-.2px; text-align:center; color:var(--frost);
  background:linear-gradient(100deg,var(--violet),var(--indigo)); border-bottom:4px solid var(--indigo-d);
  clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c)); }
.btn:active { transform:translateY(2px); border-bottom-width:2px; padding-bottom:14px; }
.btn.gold { color:var(--ink); background:linear-gradient(100deg,#FFD27A,var(--amber)); border-bottom-color:var(--amber-d); }
.btn.ghost { background:#222A6E; border-bottom-color:#141A4A; color:var(--frost); }
.btn:disabled { opacity:.55; cursor:default; }
.btn:disabled:active { transform:none; border-bottom-width:4px; padding-bottom:12px; }
.btn.small { display:inline-block; width:auto; margin:0; padding:9px 16px 7px; font-size:15px; }

/* 진행 단계: 실제 순서 */
.rail { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:16px; }
.rail div { position:relative; padding:8px 4px 6px 12px; font-size:12px; font-weight:700; line-height:1.3; color:var(--mute); background:#161D52; clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%,8px 50%); }
.rail div:first-child { clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%); padding-left:8px; }
.rail div em { display:block; font-style:normal; font-family:var(--display); font-size:15px; font-weight:400; }
.rail div.done { background:#2C3AA8; color:var(--frost); }
.rail div.now { background:linear-gradient(100deg,var(--violet),var(--indigo)); color:#fff; }
.rail div.now em { color:#FFE3A6; }

/* 납작한 목록 */
.rows { border-top:1px solid #2A3280; }
.row { display:flex; align-items:center; gap:14px; padding:14px 2px; border-bottom:1px solid #2A3280; }
.row .ico { width:46px; height:46px; flex:none; display:grid; place-items:center; background:#222A6E; clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); color:var(--mute); }
.row.on .ico { background:linear-gradient(160deg,var(--violet),var(--indigo)); color:#fff; }
.row .t { flex:1; min-width:0; }
.row .t b { display:block; font-size:15px; font-weight:700; }
.tag { display:inline-block; padding:2px 8px 1px; font-size:11px; font-weight:700; background:#222A6E; color:var(--mute); transform:skewX(-10deg); }
.tag.ok { background:#12433A; color:var(--ok); }
.tag.wait { background:#4A3708; color:var(--amber); }

/* 도감 */
.dex { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.slot { --c:12px; padding:10px 6px 10px; text-align:center; background:#161D52; clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c)); }
.slot svg { width:78px; height:78px; display:block; margin:0 auto 4px; }
.slot b { display:block; font-size:13px; }
.slot.lock { color:var(--mute); }
.slot.have { background:linear-gradient(160deg,#2B38A8,#1B2257); }

/* 보상 */
.buy { flex:none; min-width:84px; padding:8px 10px 7px; border:0; background:#222A6E; color:var(--mute); text-align:center; font-weight:700; }
.buy b { display:block; font-size:15px; } .buy span { font-size:11px; }
.buy.can { background:linear-gradient(160deg,#FFD27A,var(--amber)); color:#3A2600; }
.buy:disabled { opacity:.9; }
.coin { display:flex; align-items:baseline; gap:8px; }
.coin strong { font-family:var(--display); font-weight:400; font-size:48px; line-height:1; color:var(--amber); }
.gauge { display:grid; grid-template-columns:repeat(10,1fr); gap:3px; margin:12px 0 6px; }
.gauge i { height:10px; background:#2A3280; transform:skewX(-24deg); }
.gauge i.on { background:linear-gradient(90deg,#FFD27A,var(--amber)); }

/* 하단 탭 */
nav { position:relative; z-index:3; display:grid; grid-template-columns:repeat(5,1fr); padding:0 6px calc(env(safe-area-inset-bottom,0px) + 4px); background:#0A0E2A; border-top:1px solid #2A3280; }
nav button { position:relative; padding:10px 0 8px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; font-weight:700; color:#7683C2; }
nav button svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linejoin:miter; stroke-linecap:square; }
nav button.on { color:var(--frost); }
nav button.on::before { content:""; position:absolute; top:-1px; left:16%; right:16%; height:4px; background:var(--amber); transform:skewX(-30deg); }

/* 오버레이 */
.layer { position:absolute; inset:0; z-index:10; display:none; }
.layer.open { display:flex; }
.splash { flex-direction:column; justify-content:flex-end; padding:0 22px calc(env(safe-area-inset-bottom,0px) + 28px); background:linear-gradient(180deg,#1A2478 0%,var(--ink) 70%); overflow:hidden; }
.splash .art { position:absolute; left:0; right:0; top:0; height:58%; display:grid; place-items:center; }
.splash .art svg { width:210px; height:210px; position:relative; z-index:1; filter:drop-shadow(0 14px 0 rgba(8,11,32,.3)); }
.splash .art::before { content:""; position:absolute; left:50%; top:46%; width:330px; height:330px; transform:translate(-50%,-50%) rotate(45deg); background:linear-gradient(160deg,#4254E0,#2A1F80); opacity:.55; }
.splash h1 { font-size:52px; line-height:1; transform:skewX(-6deg); transform-origin:left bottom; }
.splash p { margin-top:10px; color:#C5CFF5; }
.splash small { display:block; margin-top:12px; text-align:center; color:var(--mute); font-size:12px; }

.sheet { align-items:flex-end; background:rgba(5,8,24,.72); }
.sheet .in { width:100%; max-height:92%; overflow-y:auto; padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 18px); background:#161D52; border-top:4px solid var(--violet);
  clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,0 100%); }
body, .layer, #view { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
input, textarea { -webkit-user-select:text; user-select:text; }
.info h3 { margin:0 0 4px; font-size:20px; } .info .sub { color:#C5CFF5; font-size:13px; margin-bottom:12px; }
.info .box { background:#0E1330; border:1px solid var(--line); padding:12px; margin:10px 0; font-size:14px; line-height:1.6; }
.info .tagx { display:inline-block; padding:3px 8px; font-size:12px; font-weight:800; background:#2B3380; margin-right:6px; }
.info .nl { padding:12px 0; border-bottom:1px solid var(--line); font-size:14px; line-height:1.55; } .info .nl b { display:block; }
.field { display:block; margin-top:14px; font-size:13px; font-weight:700; color:#C5CFF5; }
.field input[type=text], .field input[type=tel], .field input[type=password] { display:block; width:100%; margin-top:6px; padding:12px; font-size:16px; background:#0E1330; border:1px solid var(--line); border-radius:0; outline:none; }
.field input:focus { border-color:var(--amber); }
.agree { display:flex; gap:10px; margin-top:16px; font-size:12px; color:#C5CFF5; line-height:1.55; }
.agree input { width:20px; height:20px; flex:none; margin-top:1px; accent-color:var(--violet); }
.err { min-height:20px; margin-top:10px; font-size:13px; font-weight:700; color:var(--bad); }

.cam { flex-direction:column; background:#05081A; }
.cam .feed { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:linear-gradient(160deg,#10163D,#05081A); }
.cam .top { position:relative; display:flex; justify-content:space-between; align-items:flex-start; padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0; }
.cam .x { width:44px; height:44px; display:grid; place-items:center; background:rgba(8,11,32,.7); font-size:20px; clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
.cam .code { text-align:right; padding:6px 12px 5px; background:rgba(8,11,32,.78); border-right:3px solid var(--amber); }
.cam .code b { display:block; font-family:var(--display); font-weight:400; font-size:22px; letter-spacing:2px; color:var(--amber); line-height:1.1; }
.cam .code span { font-size:11px; color:#C5CFF5; }
.cam .frame { position:relative; flex:1; margin:18px 28px; }
.cam .frame i { position:absolute; width:34px; height:34px; border:0 solid var(--frost); }
.cam .frame i:nth-child(1){ left:0; top:0; border-width:4px 0 0 4px; }
.cam .frame i:nth-child(2){ right:0; top:0; border-width:4px 4px 0 0; }
.cam .frame i:nth-child(3){ left:0; bottom:0; border-width:0 0 4px 4px; }
.cam .frame i:nth-child(4){ right:0; bottom:0; border-width:0 4px 4px 0; }
.cam .stamp { position:absolute; left:12px; bottom:10px; font-weight:800; font-size:15px; line-height:1.35; color:#fff; text-shadow:0 1px 4px #000,0 0 8px #000; font-variant-numeric:tabular-nums; }
.cam .hint { position:relative; text-align:center; padding:0 28px; font-size:13px; color:#DDE4FF; text-shadow:0 1px 6px #000; }
.cam .bar { position:relative; display:flex; justify-content:center; align-items:center; gap:22px; padding:16px 20px calc(env(safe-area-inset-bottom,0px) + 24px); }
.shutter { width:76px; height:84px; background:var(--frost); clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); display:grid; place-items:center; }
.shutter::after { content:""; width:58px; height:64px; background:linear-gradient(160deg,#FFD27A,var(--amber)); clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); }
.shutter:active::after { background:var(--amber-d); }
.cam .state { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; padding:0 40px; z-index:2; font-weight:700; }

.toast { position:absolute; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 84px); z-index:30; padding:12px 16px; font-weight:700; font-size:14px; background:var(--frost); color:var(--ink); border-left:6px solid var(--violet); clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%); opacity:0; transform:translateY(8px); transition:opacity .18s, transform .18s; pointer-events:none; }
.toast.show { opacity:1; transform:none; }
.demo { position:absolute; z-index:40; left:8px; right:8px; top:calc(env(safe-area-inset-top,0px) + 2px); display:flex; flex-wrap:wrap; gap:3px; font-size:10px; }
.demo button { flex:1; padding:3px 0; background:#fff; color:#111; font-weight:700; }
.demo span { align-self:center; color:#fff; background:#000; padding:3px 6px; }
/* ===== 몬스터 쇼케이스 (홈): 몬스터가 정보 카드 위로 튀어나오는 구성 ===== */
.show { margin:0 -16px; }
.show .stage { position:relative; z-index:2; height:318px; }
.show .stage .bgfx { position:absolute; left:0; right:0; top:0; bottom:70px; overflow:hidden;
  background:
    radial-gradient(circle at 18% 28%, rgba(255,181,52,.30) 0, rgba(255,181,52,0) 22%),
    radial-gradient(circle at 82% 18%, rgba(139,107,255,.55) 0, rgba(139,107,255,0) 30%),
    radial-gradient(circle at 70% 72%, rgba(80,110,255,.45) 0, rgba(80,110,255,0) 26%),
    linear-gradient(180deg,var(--g1) 0%,var(--g2) 55%,var(--g3) 100%); transition:background .6s; }
.show .stage .bgfx::before { content:""; position:absolute; left:50%; top:52%; width:300px; height:300px; transform:translate(-50%,-50%) rotate(45deg); background:linear-gradient(160deg,rgba(150,130,255,.45),rgba(40,50,160,.25)); }
.show .stage .bgfx::after { content:""; position:absolute; left:-10%; right:-10%; bottom:-1px; height:46px; background:#0E1330; clip-path:polygon(0 100%,0 62%,18% 30%,36% 55%,54% 12%,72% 48%,88% 26%,100% 58%,100% 100%); opacity:.0; }
.show .stage > svg { position:absolute; left:50%; top:46%; width:170px; height:170px; transform:translate(-50%,-50%); }
.show .stagebtn { position:absolute; z-index:3; right:14px; top:12px; padding:7px 12px 5px; font-size:12px; font-weight:700; background:rgba(14,19,48,.72); border-left:3px solid var(--amber); clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%); }
.show .stagebtn.tilt { right:auto; left:14px; border-left-color:var(--violet); }
.show .card { position:relative; z-index:1; margin:-70px 16px 0; }
.show .card .in { padding:60px 18px 18px; text-align:center; }
.show .name { font-size:30px; }
.show .sub { margin-top:2px; color:var(--mute); font-size:13px; }
.show .prog { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin:14px auto 0; max-width:300px; }
.show .prog i { height:9px; background:#2A3280; transform:skewX(-24deg); }
.show .prog i.on { background:linear-gradient(90deg,#9B82FF,var(--violet)); }
.show .prog i.now { background:linear-gradient(90deg,#FFD27A,var(--amber)); }
.show .state { margin-top:8px; font-size:12px; color:var(--mute); }
.stats { display:grid; grid-template-columns:repeat(3,1fr); margin-top:16px; padding:14px 0 4px; border-top:1px solid #2F3992; }
.stats div + div { border-left:1px solid #2F3992; }
.stats b { display:block; font-family:var(--display); font-weight:400; font-size:20px; line-height:1.2; }
.stats span { font-size:12px; color:var(--mute); }
.stats .gold { color:var(--amber); }
.show .btn { margin-top:16px; }
.show .rail { margin-top:16px; text-align:left; }
.slot img { width:92px; height:92px; display:block; margin:0 auto 2px; }

/* ===== AR 보기 ===== */
.ar { flex-direction:column; background:#05081A; }
.ar .arbg { position:absolute; inset:0; overflow:hidden; }
.ar .arbg video { width:100%; height:100%; object-fit:cover; display:block; }
.ar .envbg { position:absolute; inset:0; background:var(--arbg,#0E1330); }
.ar .arhost { position:absolute; inset:0; }
.ar .top { position:relative; z-index:2; display:flex; justify-content:space-between; align-items:flex-start; padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 0; pointer-events:none; }
.ar .top > * { pointer-events:auto; }
.ar .x { width:44px; height:44px; display:grid; place-items:center; background:rgba(14,19,48,.72); font-size:15px; font-weight:700; clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
.ar .x.off { color:var(--mute); text-decoration:line-through; }
.pill { padding:8px 26px 6px; text-align:center; background:rgba(14,19,48,.6); border-bottom:3px solid var(--amber); transform:skewX(-8deg); backdrop-filter:blur(6px); }
.pill b { display:block; font-family:var(--display); font-weight:400; font-size:21px; line-height:1.2; }
.pill span { font-size:12px; color:#FFE3A6; }
.ar .arhint { position:absolute; left:20px; right:20px; bottom:calc(env(safe-area-inset-bottom,0px) + 150px); z-index:2; text-align:center; font-size:13px; font-weight:700; color:#fff; text-shadow:0 1px 8px #000; pointer-events:none; }
.ar .bar { position:absolute; left:0; right:0; bottom:0; z-index:2; display:flex; justify-content:center; padding:0 20px calc(env(safe-area-inset-bottom,0px) + 28px); }

    f[1].forEach(function (m, i) {
      total++; var have = !!m[2]; if (have) got++;
      var isB = m[1].charAt(0) === 'b';
      var img = isB ? '<div class="q">?</div>' : '<img class="' + (have ? '' : 'sil') + '" src="' + ART[m[1]] + '" alt="">';
      html += (i ? '<span class="arw">›</span>' : '') + '<div class="t' + (have ? ' have' : '') + '">' + img + '<b>' + (have ? m[0] : '???') + '</b></div>';
    });
    html += '</div></div>';
  });
  return '<h1>도감</h1><p class="muted" style="margin-top:6px">' + got + ' / ' + total + '마리 만났어요.</p><div class="dexv" style="margin-top:16px">' + html + '</div>';
}

function viewGift() {
  var bal = data.coins;
  var hist = data.redemptions.length ? '<div class="rows">' + data.redemptions.slice().reverse().map(function (r) {
    var done = String(r.status).toUpperCase() === 'DONE';
    return '<div class="row"><div class="t"><b>' + esc(r.name || '학식 1,000원 쿠폰') + '</b><span class="muted">' + r.cost + '포인트 사용</span></div><span class="tag ' + (done ? 'ok' : 'wait') + '">' + (done ? '지급 완료' : '처리 중') + '</span></div>';
  }).join('') + '</div>' : '<p class="muted">아직 교환한 보상이 없어요.</p>';
  var items = REWARDS.map(function (it) {
    var can = bal >= it.cost;
    return '<div class="row"><div class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter">' + ICON.gift + '</svg></div><div class="t"><b>' + esc(it.name) + '</b><span class="muted">' + esc(it.desc) + '</span></div>' +
      '<button type="button" class="buy ' + (can ? 'can' : '') + '" data-act="redeem" data-rid="' + it.id + '"' + (can ? '' : ' disabled') + '><b>' + it.cost + 'P</b><span>' + (can ? '교환하기' : (it.cost - bal) + 'P 부족') + '</span></button></div>';
  }).join('');
  var next = REWARDS.filter(function (r) { return r.cost > bal; })[0];
  var on = next ? Math.min(10, Math.floor(bal / next.cost * 10)) : 10, g = ''; for (var i = 0; i < 10; i++) g += '<i class="' + (i < on ? 'on' : '') + '"></i>';
  return '<h1>보상</h1>' +
    '<section class="panel" style="margin-top:14px"><div style="padding:18px"><p class="muted">내 포인트</p><div class="coin"><strong>' + bal + '</strong><span class="muted">P</span></div><div class="gauge">' + g + '</div>' +
    '<p class="muted">' + (next ? next.name + '까지 ' + (next.cost - bal) + 'P 남았어요.' : '모든 보상을 바꿀 수 있어요.') + '</p></div></section>' +
    '<section class="sec"><h2>포인트로 바꾸기</h2><div class="rows">' + items + '</div><p class="muted" style="margin-top:10px;font-size:12px">시범운영 보상 예시예요. 실제 보상은 운영 시작 전에 정해져요.</p></section>' +
    '<section class="sec"><h2>교환 내역</h2>' + hist + '</section>';
}

function viewMe() {
  var linked = me && me.studentId;
  var masked = linked ? me.studentId.slice(0, 2) + '****' + me.studentId.slice(-2) : '';
  return '<h1>내 정보</h1>' +
    '<section class="panel" style="margin-top:14px"><div style="padding:18px"><h2 style="font-size:18px">' + (linked ? esc(me.name) + ' 님' : '게스트') + '</h2>' +
    '</div></section>' +
    '<section class="sec"><h2>알아두세요</h2><div class="rows">' +
    '<div class="row"><div class="t"><b>인증 사진</b><span class="muted">미션 인증 사진은 운영자 확인에만 쓰여요.</span></div></div>' +
    '<div class="row"><div class="t"><b>포인트</b><span class="muted">운영자 승인 후에만 쌓여요. 보상으로 바꿀 수 있어요.</span></div></div></div></section>';
}

function render() {
  var v = { home: viewMap, go: viewGo, dex: viewDex, gift: viewGift, me: viewMe }[tab];
  unmountHero(); unmountMap();
  $('view').className = tab === 'home' ? 'map' : '';
  $('hud').style.display = $('nav').style.display = tab === 'home' ? 'none' : '';
  $('view').innerHTML = v();
  $('view').scrollTop = 0;
  renderHud(); renderNav();
  if (tab === 'home') { if (HAS3D) mountMap($('mapHost')); else $('mapHost').insertAdjacentHTML('afterbegin', '<p class="mapfail">3D 지도를 불러오지 못했어요. 아래 카드로 미션을 확인해 주세요.</p>'); mapUpdateChip(mapStage ? mapStage.missionDist() : 0); }
  if (isOpen('mon')) renderDetail();
}

/* ===== 동작 ===== */
function busy(on) { document.body.style.cursor = on ? 'progress' : ''; }
async function refresh(quiet) {
  if (!me) return;
  try { data = await api('getGameState', me.userId); }
  catch (e) {
    if (/NEED_LOGIN/.test(e.message)) { me = null; try { localStorage.removeItem(KEY); } catch (x) {} openSplash(); return; }
    if (!quiet) toast(e.message);
  }
  render();
}
async function startGuest() {
  var b = $('startBtn'); b.disabled = true; b.textContent = '준비 중...';
  try {
    var r = await api('startGuest');
    me = { userId: r.userId, name: r.name || '게스트', studentId: r.studentId || '' };
    save(); closeSplash();
    await refresh(false);
  } catch (e) { toast(e.message); }
  b.disabled = false; b.textContent = '바로 시작하기';
}

/* 카메라 인증 */
var cam = { stream: null, challenge: null, timer: null, shot: null };
async function openCamera() {
  var L = $('cam'); L.classList.add('open');
  L.innerHTML = '<div class="state muted">카메라를 켜는 중이에요...</div>';
  try {
    cam.challenge = await api('issueProofChallenge', me.userId, 'gym15');
  } catch (e) { closeCamera(); toast(e.message); return; }
  var feed = '';
  cam.real = false;
  try {
    cam.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' } } });
    feed = '<video class="feed" id="vid" autoplay muted playsinline></video>'; cam.real = true;
  } catch (e) {
    if (IS_DEMO) { feed = '<div class="feed"></div>'; }
    else {
      L.innerHTML = '<div class="top"><button class="x" type="button" data-act="camclose" aria-label="닫기">✕</button></div><div class="state"><p style="color:var(--bad)">카메라를 켜지 못했어요.</p><p class="muted" style="margin-top:6px">브라우저의 카메라 권한을 허용한 뒤 다시 눌러 주세요. 오류: ' + esc(e.name || e.message) + '</p></div>';
      return;
    }
  }
  var code = cam.challenge.token.slice(-4).toUpperCase();
  L.innerHTML = feed + '<div class="top"><button class="x" type="button" data-act="camclose" aria-label="닫기">✕</button><div class="code"><b>' + code + '</b><span id="left">남은 시간 2:00</span></div></div>' +
    '<div class="frame"><i></i><i></i><i></i><i></i><div class="stamp" id="stamp"></div></div><p class="hint">운동 중인 모습이나 운동 장소가 보이게 찍어 주세요.' + ((IS_DEMO && !cam.real) ? '<br>(카메라를 켤 수 없어 시안 화면으로 보여요)' : '') + '</p>' +
    '<div class="bar"><button class="shutter" type="button" data-act="shoot" aria-label="촬영"></button></div>';
  if (cam.real) { var v = $('vid'); v.srcObject = cam.stream; v.play().catch(function () {}); }
  clearInterval(cam.timer);
  cam.offset = cam.challenge.serverTime ? cam.challenge.serverTime - Date.now() : 0;
  var st0 = $('stamp'); if (st0) st0.textContent = stampNow();
  cam.timer = setInterval(function () {
    var stEl = $('stamp'); if (stEl) stEl.textContent = stampNow();
    var s = Math.max(0, Math.round((cam.challenge.expiresAt - Date.now()) / 1000)), el = $('left');
    if (el) el.textContent = '남은 시간 ' + Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
    if (s <= 0) { closeCamera(); toast('시간이 지났어요. 카메라를 다시 켜 주세요.'); }
  }, 500);
}
function stampNow() {
  var d = new Date(Date.now() + (cam.offset || 0)), z = function (n) { return ('0' + n).slice(-2); };
  return d.getFullYear() + '.' + z(d.getMonth() + 1) + '.' + z(d.getDate()) + ' (' + '일월화수목금토'.charAt(d.getDay()) + ') ' + z(d.getHours()) + ':' + z(d.getMinutes()) + ':' + z(d.getSeconds());
}
function closeCamera() {
  clearInterval(cam.timer);
  if (cam.stream) cam.stream.getTracks().forEach(function (t) { t.stop(); });
  cam.stream = null; $('cam').classList.remove('open'); $('cam').innerHTML = '';
}
function shoot() {
  var c = document.createElement('canvas'), ctx;
  if (!cam.real) { c.width = 640; c.height = 480; ctx = c.getContext('2d'); ctx.fillStyle = '#2F3FB8'; ctx.fillRect(0, 0, 640, 480); }
  else {
    var v = $('vid'); if (!v || !v.videoWidth) { toast('카메라 화면이 아직 준비되지 않았어요.'); return; }
    var k = Math.min(1, 960 / v.videoWidth); c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
    ctx = c.getContext('2d'); ctx.drawImage(v, 0, 0, c.width, c.height);
  }
  var fs = Math.max(16, Math.round(c.width / 32)), tx = stampNow(), cd = cam.challenge.token.slice(-4).toUpperCase();
  ctx.font = '800 ' + fs + 'px sans-serif'; ctx.textBaseline = 'bottom'; ctx.lineJoin = 'round'; ctx.lineWidth = Math.round(fs / 4); ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.fillStyle = '#fff';
  [[tx, c.height - fs * 2.6], ['인증코드 ' + cd, c.height - fs * 1.35]].forEach(function (l) { ctx.strokeText(l[0], fs * 0.6, l[1] + fs * 1.15); ctx.fillText(l[0], fs * 0.6, l[1] + fs * 1.15); });
  cam.shot = { url: c.toDataURL('image/jpeg', 0.8), at: Date.now() };
  var L = $('cam');
  L.innerHTML = '<img class="feed" style="object-fit:contain;background:#000" alt="촬영한 인증 사진" src="' + cam.shot.url + '"><div class="top"><button class="x" type="button" data-act="camclose" aria-label="닫기">✕</button></div><div style="flex:1"></div>' +
    '<div class="bar" style="flex-direction:column;align-items:stretch;gap:0"><button class="btn gold" type="button" data-act="submit">이 사진으로 제출하기</button><button class="btn ghost" type="button" data-act="retake" style="margin-top:10px">다시 찍기</button></div>';
}
async function submitShot() {
  var b = document.querySelector('[data-act=submit]'); if (b) { b.disabled = true; b.textContent = '제출 중...'; }
  try {
    await api('submitProof', me.userId, 'gym15', cam.shot.url, cam.challenge.token, cam.shot.at);
    closeCamera(); toast('제출했어요. 운영자가 확인하면 알려 드릴게요.'); await refresh(true);
  } catch (e) { if (b) { b.disabled = false; b.textContent = '이 사진으로 제출하기'; } toast(e.message); }
}
function capture() { openAR(true); }
async function redeem(rid) {
  try { await api('redeemReward', me.userId, rid); toast('교환을 신청했어요. 운영자가 처리하면 알려 드릴게요.'); }
  catch (e) { toast(e.message); }
  await refresh(true);
}

/* 학번 연결 */
var CONSENT = '개인정보 수집·이용에 동의해요. 수집 항목은 학번과 이름, 이용 목적은 보상 지급 확인, 보관은 시범운영이 끝날 때까지예요.';
function openLink() {
  $('linkBody').innerHTML = '<h2>학번 연결하기</h2><p class="muted" style="margin-top:4px">보상을 받으려면 학번과 이름이 필요해요. 지금까지 모은 기록은 그대로 이어져요.</p>' +
    '<label class="field">학번<input type="tel" id="lkSid" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="숫자 8자리"></label>' +
    '<label class="field">이름<input type="text" id="lkName" maxlength="20" autocomplete="off"></label>' +
    '<label class="field">PIN (다른 기기에서 로그인할 때 써요)<input type="password" id="lkPin" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="숫자 4~6자리"></label>' +
    '<label class="agree"><input type="checkbox" id="lkOk"><span>' + esc(CONSENT) + '</span></label>' +
    '<div class="err" id="lkErr" role="alert"></div>' +
    '<button class="btn" type="button" data-act="linkgo">학번 연결하기</button><button class="btn ghost" type="button" data-act="linkclose" style="margin-top:10px">나중에 할게요</button>';
  $('linkSheet').classList.add('open');
}
async function doLink() {
  var sid = $('lkSid').value.trim(), name = $('lkName').value.trim(), pin = $('lkPin').value, err = $('lkErr');
  if (!/^\d{8}$/.test(sid)) { err.textContent = '학번은 숫자 8자리로 입력해 주세요.'; return; }
  if (name.length < 2) { err.textContent = '이름을 입력해 주세요.'; return; }
  if (!/^\d{4,6}$/.test(pin)) { err.textContent = 'PIN은 숫자 4~6자리로 입력해 주세요.'; return; }
  if (!$('lkOk').checked) { err.textContent = '개인정보 수집·이용에 동의해야 연결할 수 있어요.'; return; }
  try {
    var r = await api('linkStudent', me.userId, sid, name, pin, true);
    me.studentId = r.studentId; me.name = r.name; save();
    $('linkSheet').classList.remove('open'); toast('학번을 연결했어요.'); render();
  } catch (e) { err.textContent = e.message; }
}

/* ===== 이벤트 ===== */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-tab],[data-act],[data-go]'); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); return; }
  if (t.dataset.go) { tab = t.dataset.go; render(); return; }
  var a = t.dataset.act;
  if (a === 'verify') openCamera();
  else if (a === 'camclose') closeCamera();
  else if (a === 'shoot') shoot();
  else if (a === 'retake') { closeCamera(); openCamera(); }
  else if (a === 'submit') submitShot();
  else if (a === 'capture') capture();
  else if (a === 'monopen') openDetail();
  else if (a === 'mapbell') openNews();
  else if (a === 'infoclose') $('infoSheet').classList.remove('open');
  else if (a === 'wildgo') { $('infoSheet').classList.remove('open'); openAR(true, t.dataset.id); }
  else if (a === 'mapmain') { var ms = todayStage(); if (ms === 'none') openCamera(); else if (ms === 'approved') capture(); else openDetail(); }
  else if (a === 'monclose') closeDetail();
  else if (a === 'mapnorth') mapState.yaw = 0;
  else if (a === 'locate') mapLocate();
  else if (a === 'ar') openAR(false);
  else if (a === 'arclose') closeAR();
  else if (a === 'artoggle') toggleArCamera();
  else if (a === 'arcatch') arCatch();
  else if (a === 'motion') { enableMotion().then(function () { t.remove(); }); }
  else if (a === 'redeem') redeem(t.dataset.rid);
  else if (a === 'link') openLink();
  else if (a === 'linkgo') doLink();
  else if (a === 'linkclose') $('linkSheet').classList.remove('open');
});
$('startBtn').addEventListener('click', startGuest);
if (!needMotionPerm()) enableMotion();

/* 시안 모드 전용: 상태 바꿔 보기 */
if (IS_DEMO) {
  var d = document.createElement('div'); d.className = 'demo'; if (!/[?&]demo=1/.test(location.search)) d.style.display = 'none';
  d.innerHTML = '<span>시안</span><button data-d="new">처음</button><button data-d="pend">승인대기</button><button data-d="appr">승인됨</button><button data-d="done">완료</button><button data-d="rich">코인300</button><span>위치</span><button data-m="gate">정문</button><button data-m="gym">학생회관</button><span>시간</span><button data-t="auto">자동</button><button data-t="day">낮</button><button data-t="dusk">노을</button><button data-t="night">밤</button>';
  $('app').appendChild(d);
  d.addEventListener('click', function (e) {
    var mk = e.target.dataset.m;
    if (mk) { var sp0 = mapStage && mapStage.sp[mk === 'gate' ? '정문' : '학생회관']; if (sp0) { mapState.x = sp0[0] - 18; mapState.z = -sp0[1] + 10; mapState.tx = null; } return; }
    var tk = e.target.dataset.t;
    if (tk) { todForce = tk === 'auto' ? null : tk; applyTod(); if (ar && ar.stage) { var wasAr = true; closeAR(); } render(); return; }
    var k = e.target.dataset.d; if (!k) return;
    var sub = function (s, cap) { return { id: 'x', missionId: 'gym15', status: s, captured: cap, submittedAt: new Date().toString() }; };
    ds = { proofs: [], catches: [], redemptions: [], coins: 0, points: 0 };
    if (k === 'pend') ds.proofs = [sub('PENDING', false)];
    if (k === 'appr') ds.proofs = [sub('APPROVED', false)];
    if (k === 'done') { ds.proofs = [sub('APPROVED', true)]; ds.catches = [{ missionId: 'gym15', monster: '근육몬', coins: 50, points: 100 }]; ds.coins = 50; ds.points = 100; }
    if (k === 'rich') { ds.proofs = [sub('APPROVED', true)]; ds.catches = [{ missionId: 'gym15', monster: '근육몬', coins: 50, points: 100 }]; ds.coins = 320; ds.points = 640; ds.redemptions = [{ rewardId: 'cafeteria1000', cost: 300, status: 'DONE' }]; }
    refresh(true);
  });
}

applyTod();
load();
if (!me) openSplash();
render();
if (me) refresh(true);
</script>
</body>
</html>
